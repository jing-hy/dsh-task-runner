# dsh-task-runner profile bundle patch (declared by `dsh.bundle.patch`).
#
# When this package is installed through the official CLI
#   dsh plugin --profile <name> add dsh-task-runner
# it is appended to the profile's `dsh.profile.bundles` layer stack and this
# patch inserts the host plugin row. The browser half is discovered
# automatically through the package.json `dsh.client` declaration (served at
# /plugins/dsh-task-runner/client.js).

- insert:
    - id: task-runner
      name: 'dsh-task-runner'
      # cordis 4.0.1 (DSH EAC 4.0.0) resolves the fiber's service dependencies from
      # the loader entry options (`Inject.resolve(fiber.entry.options.inject, ...)`);
      # declaring them here guarantees `ctx.commands` / `ctx.webServer` /
      # `ctx.webRuntime` / `ctx.sessions` are available even if a loading path
      # drops the module-level `export const inject` (observed with link installs
      # after the EAC 4.0.0 / cordis 4.0.1 upgrade).
      inject:
        - commands
        - webServer
        - webRuntime
        - sessions
